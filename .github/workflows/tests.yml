name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Aseguramos que el wrapper de Maven sea ejecutable
      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run Tests
        run: ./mvnw test
